version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: game_recommender_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${siteakthem8552449964875991}
      POSTGRES_DB: game_recommender
    ports:
      - "127.0.0.1:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      bash -c "
        psql -U postgres -c \"CREATE ROLE game_api LOGIN PASSWORD '<siteakthem8552449964875991>';\"
        psql -U postgres -c \"GRANT CONNECT ON DATABASE game_recommender TO game_api;\"
        psql -U postgres -c \"GRANT USAGE ON SCHEMA public TO game_api;\"
        psql -U postgres -c \"GRANT SELECT ON ALL TABLES IN SCHEMA public TO game_api;\"
      "
volumes:
  postgres_data: